<!doctype html>
<title>Podcast</title>
<p>Like a podcast: a second of sound, then five of quiet, over and over.</p>
<audio id="show" loop></audio>
<script>
  // A WAV made here: 1 s of a soft tone, then 5 s of silence.
  const rate = 8000;
  const samples = rate * 6;
  const buffer = new ArrayBuffer(44 + samples * 2);
  const view = new DataView(buffer);
  const text = (at, s) =>
    [...s].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  text(0, 'RIFF');
  view.setUint32(4, 36 + samples * 2, true);
  text(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, 'data');
  view.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) {
    const sound = i < rate ? Math.sin((i / rate) * 2 * Math.PI * 440) : 0;
    view.setInt16(44 + i * 2, sound * 3000, true);
  }
  const show = document.getElementById('show');
  show.src = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  show.play();
</script>
