name: Build
'on':
  push:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      os:
        description: Target Operating System
        required: true
        default: all
        type: choice
        options:
          - all
          - Windows
          - macOS
          - Linux
permissions:
  contents: read
concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
  prepare:
    name: Resolve Target Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: '${{ steps.set-matrix.outputs.matrix }}'
    steps:
      - id: set-matrix
        shell: bash
        run: >
          TARGET="${{ inputs.os || 'all' }}"


          WINDOWS='{"name":"Windows","os":"windows-latest","make":"npm run
          make","environment":"windows-signing"}'

          MACOS='{"name":"macOS","os":"macos-26","make":"npm run make --
          --arch=universal","environment":""}'

          LINUX='{"name":"Linux","os":"ubuntu-latest","make":"npm run
          make","environment":""}'


          if [ "$TARGET" = "Windows" ]; then
            JSON="[$WINDOWS]"
          elif [ "$TARGET" = "macOS" ]; then
            JSON="[$MACOS]"
          elif [ "$TARGET" = "Linux" ]; then
            JSON="[$LINUX]"
          else
            JSON="[$WINDOWS,$MACOS,$LINUX]"
          fi


          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
  build:
    name: 'Build for ${{ matrix.name }}'
    needs:
      - check
      - prepare
    strategy:
      fail-fast: false
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    runs-on: '${{ matrix.os }}'
    environment: '${{ matrix.environment != '''' && matrix.environment || null }}'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg \
            fakeroot \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils
      - name: Set up Flatpak runtimes
        if: runner.os == 'Linux'
        run: >
          flatpak remote-add --user --if-not-exists flathub
          https://dl.flathub.org/repo/flathub.flatpakrepo

          flatpak install --user -y flathub org.freedesktop.Platform//23.08
          org.freedesktop.Sdk//23.08
      - name: Check the release's tag matches package.json's version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME, but package.json says $version. Name the release's tag v$version."
            exit 1
          fi
      - name: Set up Mac signing
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE_P12: '${{ secrets.MAC_CERTIFICATE_P12 }}'
          MAC_CERTIFICATE_PASSWORD: '${{ secrets.MAC_CERTIFICATE_PASSWORD }}'
          APPLE_API_KEY_P8: '${{ secrets.APPLE_API_KEY_P8 }}'
        run: >
          if [ -z "$MAC_CERTIFICATE_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [ "$GITHUB_EVENT_NAME" = release ]; then
              echo "::error::A release must be signed and notarized, but the Mac signing secrets are missing."
              exit 1
            fi
            echo "::warning::No Mac signing secrets: this Firn.app gets a basic signature and isn't notarized."
            exit 0
          fi

          keychain="$RUNNER_TEMP/firn-signing.keychain-db"

          keychain_password="$(openssl rand -base64 24)"

          security create-keychain -p "$keychain_password" "$keychain"

          security set-keychain-settings -lut 21600 "$keychain"

          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$MAC_CERTIFICATE_P12" | base64 --decode >
          "$RUNNER_TEMP/certificate.p12"

          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"

          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q
          'Developer ID Application' ||
            { echo "::error::The certificate in MAC_CERTIFICATE_P12 isn't a Developer ID Application certificate."; exit 1; }
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          echo "FIRN_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Check for the Windows signing secrets
        id: windows-signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: '${{ secrets.AZURE_CLIENT_ID }}'
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            if [ "$GITHUB_EVENT_NAME" = release ]; then
              echo "::error::A release must be signed, but the Windows signing secrets are missing."
              exit 1
            fi
            echo "::warning::No Windows signing secrets: this Firn isn't signed."
            exit 0
          fi
          echo "sign=yes" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure
        if: steps.windows-signing.outputs.sign == 'yes'
        uses: azure/login@v3
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
      - name: Set up Windows signing
        if: steps.windows-signing.outputs.sign == 'yes'
        shell: pwsh
        run: >
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'

          New-Item -ItemType Directory -Force $dir | Out-Null

          $zip = Join-Path $dir 'client.zip'

          Invoke-WebRequest -Uri
          'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.128'
          -OutFile $zip

          Expand-Archive $zip -DestinationPath (Join-Path $dir 'client') -Force

          $dlib = Get-ChildItem $dir -Recurse -Filter
          'Azure.CodeSigning.Dlib.dll' |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw 'No Azure.CodeSigning.Dlib.dll (x64) in the
          signing package.' }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows
          Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'No signtool.exe from the Windows SDK.' }

          "signtool: $($signtool.FullName)"

          $metadata = Join-Path $dir 'metadata.json'

          @{
            Endpoint = 'https://wus2.codesigning.azure.net'
            CodeSigningAccountName = 'firn-signing'
            CertificateProfileName = 'firn-browser'
            ExcludeCredentials = @(
              'EnvironmentCredential',
              'ManagedIdentityCredential',
              'WorkloadIdentityCredential',
              'SharedTokenCacheCredential',
              'VisualStudioCredential',
              'VisualStudioCodeCredential',
              'AzurePowerShellCredential',
              'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata

          "FIRN_WINDOWS_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV

          "FIRN_WINDOWS_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV

          "FIRN_WINDOWS_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Build
        run: '${{ matrix.make }}'
        env:
          FIRN_SAFE_BROWSING_KEY: '${{ secrets.FIRN_SAFE_BROWSING_KEY }}'
          APPLE_API_KEY_ID: '${{ secrets.APPLE_API_KEY_ID }}'
          APPLE_API_ISSUER: '${{ secrets.APPLE_API_ISSUER }}'
      - name: Check the Mac app is signed and notarized
        if: runner.os == 'macOS' && env.FIRN_MAC_KEYCHAIN != ''
        env:
          APPLE_TEAM_ID: '${{ secrets.APPLE_TEAM_ID }}'
        run: |
          app="$(find out -maxdepth 2 -name Firn.app -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          team="$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [ "$team" = "$APPLE_TEAM_ID" ] ||
            { echo "::error::Firn.app is signed by team '$team', not APPLE_TEAM_ID."; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Check Firn and its installer are signed
        if: steps.windows-signing.outputs.sign == 'yes'
        shell: pwsh
        run: >
          $files = @(Get-ChildItem out -Recurse -File -Include 'Firn.exe', 'Firn
          Setup.exe')

          if ($files.Count -lt 2) { throw 'Firn.exe or Firn Setup.exe is
          missing.' }

          foreach ($file in $files) {
            & $env:FIRN_WINDOWS_SIGNTOOL verify /pa $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($file.Name) isn't signed." }
            $signature = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
      - name: Check the Mac app has its Liquid Glass icon
        if: runner.os == 'macOS'
        run: >
          app="$(find out -maxdepth 2 -name Firn.app -print -quit)"

          test -f "$app/Contents/Resources/Assets.car" ||
            { echo "::error::Firn.app has no Assets.car (the Liquid Glass icon)"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName'
          "$app/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile'
          "$app/Contents/Info.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: 'Firn for ${{ matrix.name }}'
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
            out/make/**/*.flatpak
            out/make/**/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing keychain and key
        if: always() && runner.os == 'macOS'
        run: >
          [ -z "$FIRN_MAC_KEYCHAIN" ] || security delete-keychain
          "$FIRN_MAC_KEYCHAIN"

          rm -f "$RUNNER_TEMP/AuthKey.p8"
  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Upload the installers to the release page
        env:
          GH_TOKEN: '${{ github.token }}'
        run: >
          mac_zip="$(find dist -name 'Firn-darwin-universal-*.zip' -print
          -quit)"

          if [ -n "$mac_zip" ]; then
            cp "$mac_zip" dist/Firn.for.Mac.zip
            version="$(basename "$mac_zip" .zip)"
            version="${version#Firn-darwin-universal-}"
            cp "$mac_zip" "dist/Firn-darwin-arm64-$version.zip"
            cp "$mac_zip" "dist/Firn-darwin-x64-$version.zip"
          fi

          find dist -type f -print

          find dist -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
